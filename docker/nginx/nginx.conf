events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    client_max_body_size 100M;

    upstream frontend {
        server multica-frontend:8080;
    }

    upstream backend {
        server multica-backend:8080;
    }

    server {
        listen 80;
        server_name _;

        # Common proxy headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Backend health check routes
        location /health {
            proxy_pass http://backend;
        }

        location /healthz {
            proxy_pass http://backend;
        }

        location /readyz {
            proxy_pass http://backend;
        }

        # Backend API routes
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Allow the subissue suggestion LLM call to use its 3-minute
            # backend budget instead of nginx's 60-second default.
            proxy_read_timeout 195s;
        }

        location /auth/ {
            proxy_pass http://backend;
        }

        location /uploads/ {
            proxy_pass http://backend;
        }

        # WebSocket route
        location /ws {
            proxy_pass http://backend;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400; # Keep websocket open
        }

        # Frontend routes
        location / {
            proxy_pass http://frontend;
            # Support Next.js HMR websocket in dev
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
