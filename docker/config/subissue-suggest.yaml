version: 1
business: subissue-suggest
enabled: true

# The recognition pass is shared by three independent strategy calls. The
# strategy calls run concurrently and are returned in product order:
# single_full_context -> parallel -> full_coverage. Detail generation happens
# only after the user approves or edits one of the returned outlines.
stages:
  recognize:
    llm:
      provider: openai-compatible
      base_url: ${MULTICA_LLM_BASE_URL}
      api_key_env: MULTICA_LLM_API_KEY
      model: gemini-3.8-flash
      reasoning_effort: high
      temperature: 0.2
      max_completion_tokens: 8192
      timeout_ms: 90000
      max_retries: 2

    prompt:
      system: |-
        你是任务识别助手。给你一段较长的 Multica issue 讨论的一个分段，请识别这个分段中所有明确提到的可执行任务、编号条目和工作方向。只依据分段原文，不要凭空添加，也不要把同一个任务重复输出。每项输出一个稳定 id（从 t1 开始连续编号）和原文表述 text。分段中没有可执行任务时输出空数组。严格只输出 JSON，不要输出 Markdown 或解释文字。
        输出必须是一个 JSON 对象，结构固定为：
        {"tasks":[{"id":"t1","text":"..."}]}
      user_template: |-
        分段原文（第 {{segment_index}}/{{segment_total}} 段）：
        {{comment_segment}}

        上一次输出的校验结果（若非“（无）”，必须先修正该问题再重新输出完整 JSON）：
        {{retry_feedback}}

        请输出该分段识别到的任务。

    output:
      format: json
      json_schema:
        type: object
        required: [tasks]
        properties:
          tasks:
            type: array
            items:
              type: object
              required: [id, text]
              properties:
                id: {type: string}
                text: {type: string}

  single_full_context:
    llm:
      provider: openai-compatible
      base_url: ${MULTICA_LLM_BASE_URL}
      api_key_env: MULTICA_LLM_API_KEY
      model: gemini-3.1-pro-preview
      reasoning_effort: high
      temperature: 0.4
      max_completion_tokens: 8192
      timeout_ms: 120000
      max_retries: 2

    prompt:
      system: |-
        你是“单条全覆盖（上下文）”任务拆分助手。请把原始 Multica issue 讨论中的全部明确可执行任务合并成一个可以独立交给 agent 执行的子issue。
        必须恰好返回 1 个 item，不能返回 0 个，也不能拆成 2 个或更多。该 item 的 source_task_ids 必须覆盖 identified_tasks 中的全部任务 id，一个都不能遗漏；相关任务即使看起来可以并行，也必须保留在同一个 item 中。title 要概括整个业务方向，goal 要保留完成这件事所需的背景、目标、已确定的方案和约束，但不要编造原文没有的工作。
        只返回 title、goal、business、source_task_ids，不要生成 description、stage、依赖、父issue、confidence 或其他字段。business 必须填写具体业务概念，不要使用“任务”“功能”等空泛词；title 不要自行添加【】前缀。严格只输出 JSON，不要输出 Markdown 或解释文字。
        输出必须是一个 JSON 对象，结构固定为：
        {"name":"单条全覆盖（上下文）","items":[{"title":"...","goal":"...","business":"...","source_task_ids":["t1","t2"]}]}
      user_template: |-
        原始评论内容：
        {{comment_text}}

        当前 issue：{{issue_identifier}} {{issue_title}}

        当前 issue description：
        {{issue_description}}

        执行上下文（系统已按继承链合并，子issue运行时会自动获得，不要复制进 description）：
        {{execution_context}}

        已识别的原文任务清单（若提供，这就是权威任务来源，source_task_ids 必须使用这里的 id）：
        {{identified_tasks}}

        当前业务概念：
        {{business_context}}

        已有兄弟子issue（避免重复）：
        {{siblings}}

        候选父issue（本阶段不生成父issue、stage 或 description）：
        {{candidate_parents}}

        用户额外拆分要求：
        {{human_constraints}}

        上一次输出的校验结果（若为“（无）”表示第一次调用）：
        {{retry_feedback}}

        本次只执行“单条全覆盖（上下文）”策略。请完整读取上下文后输出恰好一个 item。

    output:
      format: json
      json_schema:
        type: object
        required: [name, items]
        properties:
          name: {type: string}
          items:
            type: array
            minItems: 1
            maxItems: 1
            items:
              type: object
              required: [title, goal, business, source_task_ids]
              properties:
                title: {type: string}
                goal: {type: string}
                business: {type: string}
                source_task_ids: {type: array, items: {type: string}}

  parallel:
    llm:
      provider: openai-compatible
      base_url: ${MULTICA_LLM_BASE_URL}
      api_key_env: MULTICA_LLM_API_KEY
      model: gemini-3.1-pro-preview
      reasoning_effort: high
      temperature: 0.4
      max_completion_tokens: 8192
      timeout_ms: 120000
      max_retries: 2

    prompt:
      system: |-
        你是“并行优先”任务拆分助手。请把原始 Multica issue 讨论拆成尽可能可以同时开工的子issue，同时保持强相关工作的上下文连续性。
        先判断任务之间是否共享代码、数据、决策或前置产物；没有真实依赖、可以独立验收的任务才拆成不同 item。需要先完成前置工作才能开始的任务可以单独成为 item，但不要为了增加数量而拆散强相关工作；后续 detail 阶段再补充 stage 和依赖。
        identified_tasks 中的每个任务都必须被至少一个 item 的 source_task_ids 覆盖，不能因为追求并行而丢掉任务；不要凭空增加原文没有的工作。每个 item 只返回 title、goal、business、source_task_ids，不要生成 description、stage、依赖、父issue、confidence 或其他字段。business 必须填写具体业务概念，不要使用“任务”“功能”等空泛词；title 不要自行添加【】前缀。严格只输出 JSON，不要输出 Markdown 或解释文字。
        输出必须是一个 JSON 对象，结构固定为：
        {"name":"并行优先","items":[{"title":"...","goal":"...","business":"...","source_task_ids":["t1"]}]}
      user_template: |-
        原始评论内容：
        {{comment_text}}

        当前 issue：{{issue_identifier}} {{issue_title}}
        当前 issue description：
        {{issue_description}}

        {{execution_context}}

        已识别的原文任务清单（这是权威清单，source_task_ids 只能使用这里的 id）：
        {{identified_tasks}}

        当前业务概念：
        {{business_context}}

        已有兄弟子issue（避免重复）：
        {{siblings}}

        候选父issue（本阶段不生成父issue、stage 或 description）：
        {{candidate_parents}}

        用户额外拆分要求：
        {{human_constraints}}

        上一次输出的校验结果（若为“（无）”表示第一次调用）：
        {{retry_feedback}}

        本次只执行“并行优先”策略。优先减少真实依赖造成的等待，但不得牺牲原文任务覆盖率和必要的上下文。

    output:
      format: json
      json_schema:
        type: object
        required: [name, items]
        properties:
          name: {type: string}
          items:
            type: array
            minItems: 1
            items:
              type: object
              required: [title, goal, business, source_task_ids]
              properties:
                title: {type: string}
                goal: {type: string}
                business: {type: string}
                source_task_ids: {type: array, items: {type: string}}

  full_coverage:
    llm:
      provider: openai-compatible
      base_url: ${MULTICA_LLM_BASE_URL}
      api_key_env: MULTICA_LLM_API_KEY
      model: gemini-3.1-pro-preview
      reasoning_effort: high
      temperature: 0.4
      max_completion_tokens: 8192
      timeout_ms: 120000
      max_retries: 2

    prompt:
      system: |-
        你是“全量覆盖”任务拆分助手。请把原始 Multica issue 讨论中识别出的任务按尽可能清晰、可独立验收的粒度列出，重点保证任务清单完整。
        identified_tasks 中的每一个任务 id 都必须至少出现在一个 item 的 source_task_ids 中；任何明确任务、编号条目或独立工作方向都不能遗漏。默认一个明确任务对应一个 item，只有两个任务强耦合、分开后任一 item 无法独立执行时才允许合并，合并后必须列出全部对应的 source_task_ids。
        不以“是否可以并行”作为首要目标，也不要为了合并而丢失任务边界；不要凭空增加原文没有的工作。每个 item 只返回 title、goal、business、source_task_ids，不要生成 description、stage、依赖、父issue、confidence 或其他字段。business 必须填写具体业务概念，不要使用“任务”“功能”等空泛词；title 不要自行添加【】前缀。严格只输出 JSON，不要输出 Markdown 或解释文字。
        输出必须是一个 JSON 对象，结构固定为：
        {"name":"全量覆盖","items":[{"title":"...","goal":"...","business":"...","source_task_ids":["t1"]}]}
      user_template: |-
        原始评论内容：
        {{comment_text}}

        当前 issue：{{issue_identifier}} {{issue_title}}
        当前 issue description：
        {{issue_description}}

        {{execution_context}}

        已识别的原文任务清单（这是权威清单，source_task_ids 只能使用这里的 id）：
        {{identified_tasks}}

        当前业务概念：
        {{business_context}}

        已有兄弟子issue（避免重复）：
        {{siblings}}

        候选父issue（本阶段不生成父issue、stage 或 description）：
        {{candidate_parents}}

        用户额外拆分要求：
        {{human_constraints}}

        上一次输出的校验结果（若为“（无）”表示第一次调用）：
        {{retry_feedback}}

        本次只执行“全量覆盖”策略。请优先保证任务清单逐项可追溯；输出数量可以多，但每一项都必须来自原始上下文。

    output:
      format: json
      json_schema:
        type: object
        required: [name, items]
        properties:
          name: {type: string}
          items:
            type: array
            minItems: 1
            items:
              type: object
              required: [title, goal, business, source_task_ids]
              properties:
                title: {type: string}
                goal: {type: string}
                business: {type: string}
                source_task_ids: {type: array, items: {type: string}}

  detail:
    llm:
      provider: openai-compatible
      base_url: ${MULTICA_LLM_BASE_URL}
      api_key_env: MULTICA_LLM_API_KEY
      model: gemini-3.1-pro-preview
      reasoning_effort: high
      temperature: 0.3
      max_completion_tokens: 16384
      timeout_ms: 180000
      max_retries: 2

    prompt:
      system: |-
        你是一个 Multica 子issue详情生成助手。用户已经人工确认了拆分草稿，你只能为草稿中的每个条目补充可执行的详细 description、stage、依赖关系、建议父issue和 confidence。
        必须严格保留 approved_outline 中每个条目的 id、title、goal、数量和顺序，不得增加、删除、合并、拆分或改写这些字段。description 必须让接手者不需要回看原始讨论就能开工，并包含背景、已经确定的约束、工作范围和验收标准。严格只输出 JSON，不要输出 Markdown 或解释文字。
        输出必须是一个 JSON 对象，结构固定为：
        {"subissues":[{"id":"approved_outline中的原始id","title":"approved_outline中的原始title","goal":"approved_outline中的原始goal","description":"...","stage":1,"depends_on_ids":[],"suggested_parent_identifier":null,"confidence":0.86}]}
      user_template: |-
        原始评论内容：
        {{comment_text}}

        当前 issue：{{issue_identifier}} {{issue_title}}

        当前 issue description：
        {{issue_description}}

        执行上下文（系统已按继承链合并，子issue运行时会自动获得，不要复制进 description）：
        {{execution_context}}

        当前业务概念（已用于确认草稿的标题前缀）：
        {{business_context}}

        已有兄弟子issue：
        {{siblings}}

        候选父issue：
        {{candidate_parents}}

        用户额外拆分要求：
        {{human_constraints}}

        已确认的拆分草稿（这是不可变结构）：
        {{approved_outline}}

        上一次输出的校验结果（若非“（无）”，必须先修正该问题再重新输出完整 JSON）：
        {{retry_feedback}}

        请仅为已确认条目生成详细内容。

    output:
      format: json
      json_schema:
        type: object
        required: [subissues]
        properties:
          subissues:
            type: array
            items:
              type: object
              required: [id, title, goal, description, stage, depends_on_ids, confidence]
              properties:
                id: {type: string}
                title: {type: string}
                goal: {type: string}
                description: {type: string}
                stage: {type: integer, minimum: 1}
                depends_on_ids: {type: array, items: {type: string}}
                suggested_parent_identifier: {type: [string, "null"]}
                confidence: {type: number, minimum: 0, maximum: 1}
