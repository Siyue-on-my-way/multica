version: 1
business: subissue-suggest
enabled: true

# The two calls belong to this business but have independent prompts and
# budgets. The outline pass is intentionally short; detail generation happens
# only after the user approves or edits one of its plans.
stages:
  outline:
    llm:
      provider: openai-compatible
      base_url: ${MULTICA_LLM_BASE_URL}
      api_key_env: MULTICA_LLM_API_KEY
      model: gemini-3.1-pro-preview
      temperature: 0.4
      max_completion_tokens: 2048
      timeout_ms: 60000
      max_retries: 2

    prompt:
      system: |-
        你是一个任务拆分方案设计助手。请根据一段 Multica issue 讨论，生成三种不同粒度的候选拆分方案：
        1. 上下文优先：尽量合并强相关内容，允许最终只有一个子issue，保证接手者拥有连贯上下文。
        2. 平衡拆分：只拆出边界清晰且有独立价值的任务。
        3. 并行优先：把确实可以独立并行处理的任务分开，但不要为了增加数量而拆散强相关工作。
        每个方案只返回子issue的 title、goal 和 business，不要生成 description、stage、依赖、父issue或其他字段。business 必须是从原始评论、当前 issue 标题/description 和上级上下文中识别出的具体业务概念或产品能力，例如“生成子issue”“日报/周报/年报生成”“订单支付”，不能写成“任务”“功能”这类空泛词。提示中提供的“当前业务概念”是标题前缀的优先依据；只要上下文能识别出业务，就必须填写该业务，不能留空，也不能使用“整体流程”。只有确实没有任何可识别业务概念时，才允许使用“整体流程”。business 不要包含【】；title 只写任务名称，服务端会统一添加【business】前缀。方案必须来自原始讨论，不能凭空添加工作。严格只输出 JSON，不要输出 Markdown 或解释文字。
        输出必须是一个 JSON 对象，结构固定为：
        {"plans":[{"name":"上下文优先|平衡拆分|并行优先","items":[{"title":"...","goal":"...","business":"..."}]}]}
      user_template: |-
        原始评论内容：
        {{comment_text}}

        当前 issue：{{issue_identifier}} {{issue_title}}

        当前 issue description：
        {{issue_description}}

        上级 issue 上下文：
        {{ancestor_brief}}

        当前业务概念（优先用于每个条目的 business 和标题前缀；只有原始讨论明确包含多个不同业务时才分别使用不同概念）：
        {{business_context}}

        已有兄弟子issue（避免重复）：
        {{siblings}}

        候选父issue（仅供理解上下文，不要在本阶段输出父issue）：
        {{candidate_parents}}

        用户额外拆分要求：
        {{human_constraints}}

        请输出 2～3 种拆分方案。

    output:
      format: json
      json_schema:
        type: object
        required: [plans]
        properties:
          plans:
            type: array
            items:
              type: object
              required: [name, items]
              properties:
                name: {type: string}
                items:
                  type: array
                  items:
                    type: object
                    required: [title, goal, business]
                    properties:
                      title: {type: string}
                      goal: {type: string}
                      business: {type: string}

  detail:
    llm:
      provider: openai-compatible
      base_url: ${MULTICA_LLM_BASE_URL}
      api_key_env: MULTICA_LLM_API_KEY
      model: gemini-3.1-pro-preview
      temperature: 0.3
      max_completion_tokens: 4096
      timeout_ms: 180000
      max_retries: 2

    prompt:
      system: |-
        你是一个 Multica 子issue详情生成助手。用户已经人工确认了拆分草稿，你只能为草稿中的每个条目补充可执行的详细 description、stage、依赖关系、建议父issue和 confidence。
        必须严格保留 approved_outline 中每个条目的 id、title、goal、数量和顺序，不得增加、删除、合并、拆分或改写这些字段。description 必须让接手者不需要回看原始讨论就能开工，并包含背景、已经确定的约束、工作范围和验收标准。严格只输出 JSON，不要输出 Markdown 或解释文字。
        输出必须是一个 JSON 对象，结构固定为：
        {"subissues":[{"id":"approved_outline中的原始id","title":"approved_outline中的原始title","goal":"approved_outline中的原始goal","description":"...","stage":1,"depends_on_ids":[],"suggested_parent_identifier":null,"confidence":0.86}]}
      user_template: |-
        原始评论内容：
        {{comment_text}}

        当前 issue：{{issue_identifier}} {{issue_title}}

        当前 issue description：
        {{issue_description}}

        上级 issue 上下文：
        {{ancestor_brief}}

        当前业务概念（已用于确认草稿的标题前缀）：
        {{business_context}}

        已有兄弟子issue：
        {{siblings}}

        候选父issue：
        {{candidate_parents}}

        用户额外拆分要求：
        {{human_constraints}}

        已确认的拆分草稿（这是不可变结构）：
        {{approved_outline}}

        请仅为已确认条目生成详细内容。

    output:
      format: json
      json_schema:
        type: object
        required: [subissues]
        properties:
          subissues:
            type: array
            items:
              type: object
              required: [id, title, goal, description, stage, depends_on_ids, confidence]
              properties:
                id: {type: string}
                title: {type: string}
                goal: {type: string}
                description: {type: string}
                stage: {type: integer, minimum: 1}
                depends_on_ids: {type: array, items: {type: string}}
                suggested_parent_identifier: {type: [string, "null"]}
                confidence: {type: number, minimum: 0, maximum: 1}
