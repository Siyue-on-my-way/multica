name: multica

services:
  multica-backend:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - ./volumes/backend_uploads:/app/data/uploads
      - ./config:/app/config/llm:ro
    environment:
      MULTICA_LLM_CONFIG_DIR: /app/config/llm
      MULTICA_LLM_CONFIG_POLL_INTERVAL: 5s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./.env
    restart: unless-stopped

  multica-frontend:
    build:
      context: ..
      dockerfile: Dockerfile.web
    depends_on:
      - multica-backend
    env_file:
      - ./.env
    restart: unless-stopped

  multica-nginx:
    image: nginx:1.27-alpine
    ports:
      - "0.0.0.0:${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/downloads:/usr/share/nginx/html/downloads:ro
    depends_on:
      - multica-frontend
      - multica-backend
    restart: unless-stopped
