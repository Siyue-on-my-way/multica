name: Fork CLI Release

on:
  push:
    tags:
      - "v*.*.*-*"
      - "!v*-dirty*"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Siyue-on-my-way/multica'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Run focused CLI tests
        working-directory: server
        run: go test ./internal/cli ./cmd/multica

      - name: Publish fork CLI release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --config .goreleaser.fork.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
